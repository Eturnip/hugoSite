{{- $date := .date -}}
{{- if not $date -}}
  {{- if .Page -}}
    {{- $date = .Page.Date -}}
  {{- else -}}
    {{- return -}}
  {{- end -}}
{{- end -}}
{{- if (eq $date "") -}}
  {{- return -}}
{{- end -}}
{{- $value := time.AsTime $date -}}
{{- $formatted := $value.Format "Jan 2, 2006" -}}
<span class="{{ .class | default "text-muted small text-nowrap" }}">{{ $formatted }}</span>
